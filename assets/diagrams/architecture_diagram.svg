  </marker>
  <marker id="arrow-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M1 1.5L8 5L1 8.5" fill="none" stroke="#534AB7" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <!-- Subtle card drop shadow -->
  <filter id="shadow" x="-2%" y="-2%" width="104%" height="106%" filterUnits="userSpaceOnUse">
    <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-opacity="0.06"/>
  </filter>
</defs>

<!-- Pure White Background -->
<rect width="840" height="880" fill="#FFFFFF"/>

<!-- ========================================== -->
<!-- 1. DATA INGESTION & ACQUISITION LAYER      -->
