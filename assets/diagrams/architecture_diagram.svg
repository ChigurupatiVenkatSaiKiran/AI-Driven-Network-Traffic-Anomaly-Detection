<rect x="40" y="24" width="760" height="78" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)"/>
<rect x="40" y="24" width="6" height="78" rx="3" fill="#0284C7"/>
<text x="58" y="44" font-size="12" font-weight="700" fill="#0369A1" letter-spacing="0.5">1. DATA INGESTION &amp; ACQUISITION LAYER</text>

<!-- Sub-boxes -->
<rect x="58" y="52" width="230" height="42" rx="6" fill="#E0F2FE" stroke="#0284C7" stroke-width="0.8"/>
<text x="173" y="68" text-anchor="middle" font-size="11" font-weight="700" fill="#0369A1">UNSW-NB15 Benchmark</text>
<text x="173" y="83" text-anchor="middle" font-size="9.5" fill="#0284C7">175,341 flows · 49 raw features · 9 attacks</text>

<rect x="305" y="52" width="230" height="42" rx="6" fill="#E0F2FE" stroke="#0284C7" stroke-width="0.8"/>
<text x="420" y="68" text-anchor="middle" font-size="11" font-weight="700" fill="#0369A1">Live Packet Capture (Scapy)</text>
<text x="420" y="83" text-anchor="middle" font-size="9.5" fill="#0284C7">Npcap NDIS driver · 5-tuple aggregation</text>

<rect x="552" y="52" width="230" height="42" rx="6" fill="#E0F2FE" stroke="#0284C7" stroke-width="0.8"/>
<text x="667" y="68" text-anchor="middle" font-size="11" font-weight="700" fill="#0369A1">Custom CSV Ingestion</text>
<text x="667" y="83" text-anchor="middle" font-size="9.5" fill="#0284C7">Batch streaming · live upload validation</text>

<!-- Connector 1 -> 2 -->
<line x1="420" y1="102" x2="420" y2="124" stroke="#64748B" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="428" y="116" font-size="9" font-style="italic" fill="#64748B">raw network flow records</text>

<!-- ========================================== -->
<!-- 2. FEATURE ENGINEERING & PREPROCESSING     -->
<!-- ========================================== -->
<rect x="40" y="124" width="760" height="74" rx="8" fill="#FAF5FF" stroke="#E9D5FF" stroke-width="1" filter="url(#shadow)"/>
<rect x="40" y="124" width="6" height="74" rx="3" fill="#9333EA"/>
<text x="58" y="143" font-size="12" font-weight="700" fill="#7E22CE" letter-spacing="0.5">2. FEATURE ENGINEERING &amp; PREPROCESSING PIPELINE</text>

<!-- 4 Sequential Boxes -->
<rect x="58" y="150" width="165" height="38" rx="5" fill="#F3E8FF" stroke="#A855F7" stroke-width="0.8"/>
<text x="140" y="165" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6B21A8">Imputation</text>
<text x="140" y="178" text-anchor="middle" font-size="9" fill="#7E22CE">Median / Mode fill</text>

<line x1="223" y1="169" x2="243" y2="169" stroke="#9333EA" stroke-width="1.1" marker-end="url(#arrow-purple)"/>

<rect x="245" y="150" width="165" height="38" rx="5" fill="#F3E8FF" stroke="#A855F7" stroke-width="0.8"/>
<text x="327" y="165" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6B21A8">Label Encoding</text>
<text x="327" y="178" text-anchor="middle" font-size="9" fill="#7E22CE">proto, service, state</text>

<line x1="410" y1="169" x2="430" y2="169" stroke="#9333EA" stroke-width="1.1" marker-end="url(#arrow-purple)"/>

<rect x="432" y="150" width="165" height="38" rx="5" fill="#F3E8FF" stroke="#A855F7" stroke-width="0.8"/>
<text x="514" y="165" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6B21A8">StandardScaler</text>
<text x="514" y="178" text-anchor="middle" font-size="9" fill="#7E22CE">Zero mean, unit variance</text>

<line x1="597" y1="169" x2="617" y2="169" stroke="#9333EA" stroke-width="1.1" marker-end="url(#arrow-purple)"/>

<rect x="619" y="150" width="165" height="38" rx="5" fill="#F3E8FF" stroke="#A855F7" stroke-width="0.8"/>
<text x="701" y="165" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6B21A8">Feature Selection</text>
<text x="701" y="178" text-anchor="middle" font-size="9" fill="#7E22CE">Variance filter → d = 39</text>

<!-- Connector 2 -> 3 (Split to 3 models) -->
<path d="M420 198 L420 216 M180 216 L660 216 M180 216 L180 236 M420 216 L420 236 M660 216 L660 236" fill="none" stroke="#64748B" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="428" y="210" font-size="9" font-style="italic" fill="#64748B">normalized feature vectors x ∈ ℝ³⁹</text>

<!-- ========================================== -->
<!-- 3. TRI-CORE HYBRID MACHINE LEARNING CORE   -->
<!-- ========================================== -->
<rect x="40" y="236" width="760" height="196" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)"/>
<rect x="40" y="236" width="6" height="196" rx="3" fill="#0F172A"/>
<text x="58" y="255" font-size="12" font-weight="700" fill="#0F172A" letter-spacing="0.5">3. TRI-CORE HYBRID AI DETECTION ENGINE</text>

<!-- Model 1: Deep Autoencoder -->
<rect x="58" y="264" width="232" height="156" rx="6" fill="#F0FDFA" stroke="#0D9488" stroke-width="1"/>
<rect x="58" y="264" width="232" height="28" rx="6" fill="#CCFBF1"/>
<text x="174" y="282" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0F766E">Deep Denoising Autoencoder</text>
<text x="72" y="306" font-size="9.5" font-weight="600" fill="#115E59">• Paradigm: <tspan font-weight="400">Semi-Supervised (Normal y=0)</tspan></text>
<text x="72" y="322" font-size="9.5" font-weight="600" fill="#115E59">• Encoder: <tspan font-weight="400">39 → 128 → 64 → 32 → 8 (Latent)</tspan></text>
<text x="72" y="338" font-size="9.5" font-weight="600" fill="#115E59">• Decoder: <tspan font-weight="400">8 → 32 → 64 → 128 → 39</tspan></text>
<text x="72" y="354" font-size="9.5" font-weight="600" fill="#115E59">• Denoising: <tspan font-weight="400">Gaussian noise (σ = 0.05)</tspan></text>
<text x="72" y="370" font-size="9.5" font-weight="600" fill="#115E59">• Objective: <tspan font-weight="400">MSE Loss + L1 Sparsity</tspan></text>
<text x="72" y="386" font-size="9.5" font-weight="600" fill="#115E59">• Anomaly Metric: <tspan font-weight="400">Reconstruction Error ε &gt; τ</tspan></text>
<rect x="72" y="394" width="204" height="18" rx="4" fill="#0D9488"/>
<text x="174" y="407" text-anchor="middle" font-size="9.5" font-weight="700" fill="#FFFFFF">Accuracy: 89.44% · ROC-AUC: 0.9767</text>

<!-- Model 2: XGBoost Classifier -->
<rect x="304" y="264" width="232" height="156" rx="6" fill="#FFF7ED" stroke="#EA580C" stroke-width="1"/>
<rect x="304" y="264" width="232" height="28" rx="6" fill="#FFEDD5"/>
<text x="420" y="282" text-anchor="middle" font-size="11.5" font-weight="700" fill="#C2410C">XGBoost Gradient Boosting</text>
<text x="318" y="306" font-size="9.5" font-weight="600" fill="#9A3412">• Paradigm: <tspan font-weight="400">Supervised Classification</tspan></text>
<text x="318" y="322" font-size="9.5" font-weight="600" fill="#9A3412">• Objective: <tspan font-weight="400">binary:logistic log-loss</tspan></text>
<text x="318" y="338" font-size="9.5" font-weight="600" fill="#9A3412">• Tuning: <tspan font-weight="400">GridSearchCV (27 combinations)</tspan></text>
<text x="318" y="354" font-size="9.5" font-weight="600" fill="#9A3412">• Tree Architecture: <tspan font-weight="400">n_est=500, depth=8</tspan></text>
<text x="318" y="370" font-size="9.5" font-weight="600" fill="#9A3412">• Learning Rate: <tspan font-weight="400">η = 0.20 · scale_pos=1.57</tspan></text>
<text x="318" y="386" font-size="9.5" font-weight="600" fill="#9A3412">• Validation: <tspan font-weight="400">3-Fold Stratified K-Fold</tspan></text>
<rect x="318" y="394" width="204" height="18" rx="4" fill="#EA580C"/>
<text x="420" y="407" text-anchor="middle" font-size="9.5" font-weight="700" fill="#FFFFFF">Accuracy: 89.77% · ROC-AUC: 0.9835</text>

<!-- Model 3: Isolation Forest Hybrid -->
<rect x="550" y="264" width="232" height="156" rx="6" fill="#F0FDF4" stroke="#16A34A" stroke-width="1"/>
<rect x="550" y="264" width="232" height="28" rx="6" fill="#DCFCE7"/>
<text x="666" y="282" text-anchor="middle" font-size="11.5" font-weight="700" fill="#15803D">Isolation Forest Ensemble</text>
<text x="564" y="306" font-size="9.5" font-weight="600" fill="#166534">• Paradigm: <tspan font-weight="400">Unsupervised Spatial Isolation</tspan></text>
<text x="564" y="322" font-size="9.5" font-weight="600" fill="#166534">• Tree Estimators: <tspan font-weight="400">200 Isolation Trees</tspan></text>
<text x="564" y="338" font-size="9.5" font-weight="600" fill="#166534">• Contamination: <tspan font-weight="400">auto (empirical quantile)</tspan></text>
<text x="564" y="354" font-size="9.5" font-weight="600" fill="#166534">• Meta-Feature: <tspan font-weight="400">IF score + AE error feature</tspan></text>
<text x="564" y="370" font-size="9.5" font-weight="600" fill="#166534">• Hybrid Stacking: <tspan font-weight="400">XGB Meta-Classifier blend</tspan></text>
<text x="564" y="386" font-size="9.5" font-weight="600" fill="#166534">• Zero-Day Robust: <tspan font-weight="400">Labels not strictly required</tspan></text>
<rect x="564" y="394" width="204" height="18" rx="4" fill="#16A34A"/>
<text x="666" y="407" text-anchor="middle" font-size="9.5" font-weight="700" fill="#FFFFFF">Accuracy: 90.43% · ROC-AUC: 0.9833</text>

<!-- Connector 3 -> 4 (Merge to 1) -->
<path d="M180 432 L180 450 M420 432 L420 450 M660 432 L660 450 M180 450 L660 450 M420 450 L420 468" fill="none" stroke="#64748B" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="428" y="460" font-size="9" font-style="italic" fill="#64748B">model scores &amp; reconstruction residuals</text>

