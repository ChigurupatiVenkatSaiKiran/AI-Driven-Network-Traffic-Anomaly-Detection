<rect x="552" y="588" width="230" height="42" rx="6" fill="#F8FAFC" stroke="#64748B" stroke-width="0.8"/>
<text x="667" y="605" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">Security Incident Log</text>
<text x="667" y="620" text-anchor="middle" font-size="9.5" fill="#475569">CSV telemetry · audit logs · alerts</text>

