<!-- 4. THRESHOLD CALIBRATION & DECISION FUSION -->
<!-- ========================================== -->
<rect x="40" y="468" width="760" height="72" rx="8" fill="#FEFCE8" stroke="#FDE047" stroke-width="1" filter="url(#shadow)"/>
<rect x="40" y="468" width="6" height="72" rx="3" fill="#CA8A04"/>
<text x="58" y="488" font-size="12" font-weight="700" fill="#A16207" letter-spacing="0.5">4. PRIOR-ADJUSTED THRESHOLD CALIBRATION &amp; ENSEMBLE FUSION</text>

<rect x="58" y="496" width="724" height="34" rx="5" fill="#FEF08A" stroke="#EAB308" stroke-width="0.8"/>
<text x="420" y="511" text-anchor="middle" font-size="10.5" font-weight="700" fill="#713F12">
  Prior-Adjusted Cutoffs:  τ_AE = 0.327  ·  τ_XGB = 0.592  ·  τ_IF = 0.345
</text>
<text x="420" y="524" text-anchor="middle" font-size="9.5" fill="#854D0E">
  Weighted Meta-Decision Fusion: ŷ = 1  if  [0.35 · 𝟙(ε &gt; τ_AE) + 0.40 · 𝟙(p_XGB &gt; τ_XGB) + 0.25 · 𝟙(s_IF &gt; τ_IF)] ≥ 0.50
</text>

<!-- Connector 4 -> 5 -->
<line x1="420" y1="540" x2="420" y2="560" stroke="#64748B" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="428" y="552" font-size="9" font-style="italic" fill="#64748B">binary decision &amp; calibrated anomaly score</text>

