<svg width="840" height="740" viewBox="0 0 840 740" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M1.5 1.5L8.5 5L1.5 8.5" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#00000015"/></filter>
  <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1A5276"/><stop offset="1" stop-color="#2980B9"/></linearGradient>
  <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#B9770E"/><stop offset="1" stop-color="#E67E22"/></linearGradient>
  <linearGradient id="g3" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6C3483"/><stop offset="1" stop-color="#8E44AD"/></linearGradient>
  <linearGradient id="g4" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#117864"/><stop offset="1" stop-color="#1ABC9C"/></linearGradient>
  <linearGradient id="g5" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1E8449"/><stop offset="1" stop-color="#27AE60"/></linearGradient>
  <linearGradient id="g6" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#922B21"/><stop offset="1" stop-color="#C0392B"/></linearGradient>
</defs>

<!-- Background -->
<rect width="840" height="740" fill="#F0F2F5"/>

<!-- TITLE BAR -->
<rect x="0" y="0" width="840" height="46" fill="#1a1a2e"/>
<text x="420" y="18" text-anchor="middle" font-size="11.5" font-weight="700" fill="white">End-to-End Machine Learning Pipeline: Offline Training vs. Real-Time Inference</text>
<text x="420" y="34" text-anchor="middle" font-size="9.5" fill="#aab">Dual-Stream Lifecycle · Model GridSearch Training · Online Forward Passes · Multi-Threshold Fusion · Live Streamlit Sync</text>

<!-- LEFT COLUMN: OFFLINE TRAINING -->
<rect x="40" y="58" width="365" height="610" rx="8" fill="white" filter="url(#sh)"/>
<rect x="40" y="58" width="365" height="34" rx="8" fill="url(#g1)"/>
<text x="222" y="79" text-anchor="middle" font-size="11" font-weight="700" fill="white">PHASE I: OFFLINE MODEL TRAINING</text>

<!-- Left Step 1 -->
<rect x="56" y="104" width="333" height="52" rx="6" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1"/>
<text x="222" y="122" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1A5276">1. Benchmark Dataset Loading</text>
<text x="222" y="139" text-anchor="middle" font-size="9" fill="#555">Train 82,332 · Test 45,332 samples · 9 Attack Classes</text>
<line x1="222" y1="156" x2="222" y2="176" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>

<!-- Left Step 2 -->
<rect x="56" y="176" width="333" height="56" rx="6" fill="#FAF5FF" stroke="#E9D5FF" stroke-width="1"/>
<text x="222" y="194" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6C3483">2. Feature Engineering &amp; Standardization</text>
<text x="222" y="210" text-anchor="middle" font-size="9" fill="#555">LabelEncoder (proto, state) · StandardScaler (μ=0, σ=1)</text>
<text x="222" y="224" text-anchor="middle" font-size="8.5" fill="#888">Variance Selection filter → d = 39 features</text>
<line x1="222" y1="232" x2="222" y2="252" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>

<!-- Left Step 3: Tri-Models -->
<rect x="56" y="252" width="333" height="170" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
<text x="222" y="270" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1a1a2e">3. Concurrent Model Training</text>

<!-- AE Sub -->
<rect x="66" y="280" width="98" height="130" rx="5" fill="white" stroke="#1ABC9C" stroke-width="1"/>
<rect x="66" y="280" width="98" height="6" rx="5" fill="url(#g4)"/>
<text x="115" y="298" text-anchor="middle" font-size="9" font-weight="700" fill="#117864">Autoencoder</text>
<text x="115" y="314" text-anchor="middle" font-size="8" fill="#555">Normal y=0 only</text>
<text x="115" y="328" text-anchor="middle" font-size="8" fill="#555">39→128→64→8</text>
<text x="115" y="342" text-anchor="middle" font-size="8" fill="#555">MSE Loss</text>
<text x="115" y="356" text-anchor="middle" font-size="8" fill="#555">150 Epochs</text>
<rect x="74" y="380" width="82" height="20" rx="3" fill="#E8F8F5"/>
<text x="115" y="394" text-anchor="middle" font-size="8.5" font-weight="700" fill="#117864">89.44% Acc</text>

<!-- XGB Sub -->
<rect x="173" y="280" width="98" height="130" rx="5" fill="white" stroke="#E67E22" stroke-width="1"/>
<rect x="173" y="280" width="98" height="6" rx="5" fill="url(#g2)"/>
<text x="222" y="298" text-anchor="middle" font-size="9" font-weight="700" fill="#B9770E">XGBoost</text>
<text x="222" y="314" text-anchor="middle" font-size="8" fill="#555">GridSearch 27-grid</text>
<text x="222" y="328" text-anchor="middle" font-size="8" fill="#555">n_est=500, d=8</text>
<text x="222" y="342" text-anchor="middle" font-size="8" fill="#555">lr = 0.20</text>
<text x="222" y="356" text-anchor="middle" font-size="8" fill="#555">3-Fold Stratified</text>
<rect x="181" y="380" width="82" height="20" rx="3" fill="#FEF5E7"/>
<text x="222" y="394" text-anchor="middle" font-size="8.5" font-weight="700" fill="#B9770E">89.77% Acc</text>

<!-- IF Sub -->
<rect x="280" y="280" width="98" height="130" rx="5" fill="white" stroke="#27AE60" stroke-width="1"/>
<rect x="280" y="280" width="98" height="6" rx="5" fill="url(#g5)"/>
<text x="329" y="298" text-anchor="middle" font-size="9" font-weight="700" fill="#1E8449">IF Ensemble</text>
<text x="329" y="314" text-anchor="middle" font-size="8" fill="#555">200 iTrees</text>
<text x="329" y="328" text-anchor="middle" font-size="8" fill="#555">Unsupervised</text>
<text x="329" y="342" text-anchor="middle" font-size="8" fill="#555">AE Error Stacking</text>
<text x="329" y="356" text-anchor="middle" font-size="8" fill="#555">Meta-Boost</text>
<rect x="288" y="380" width="82" height="20" rx="3" fill="#EAFAF1"/>
<text x="329" y="394" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1E8449">90.43% Acc</text>

<line x1="222" y1="422" x2="222" y2="442" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>

<!-- Left Step 4 -->
<rect x="56" y="442" width="333" height="52" rx="6" fill="#FEFCE8" stroke="#FDE047" stroke-width="1"/>
<text x="222" y="460" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7D6608">4. Threshold Calibration</text>
<text x="222" y="476" text-anchor="middle" font-size="9" fill="#555">P95 normal residuals · Youden J · τ_AE=0.327, τ_XGB=0.592</text>
<line x1="222" y1="494" x2="222" y2="514" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>

<!-- Left Step 5 -->
<rect x="56" y="514" width="333" height="52" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
<text x="222" y="532" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1a1a2e">5. Artefact Serialization</text>
<text x="222" y="548" text-anchor="middle" font-size="9" fill="#555">autoencoder.keras · xgboost_model.pkl · isolation_forest.pkl</text>
<line x1="222" y1="566" x2="222" y2="586" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>

<!-- Left Step 6 -->
<rect x="56" y="586" width="333" height="52" rx="6" fill="#EAFAF1" stroke="#27AE60" stroke-width="1"/>
<text x="222" y="604" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1E8449">6. Evaluation Report</text>
<text x="222" y="620" text-anchor="middle" font-size="9" font-weight="700" fill="#1E8449">ROC-AUC: 0.9835 · F1: 92.55% · Precision: 98.51%</text>


<!-- RIGHT COLUMN: ONLINE INFERENCE -->
<rect x="435" y="58" width="365" height="610" rx="8" fill="white" filter="url(#sh)"/>
<rect x="435" y="58" width="365" height="34" rx="8" fill="url(#g2)"/>
<text x="617" y="79" text-anchor="middle" font-size="11" font-weight="700" fill="white">PHASE II: REAL-TIME INFERENCE PIPELINE</text>

<!-- Right Step 1 -->
<rect x="451" y="104" width="333" height="52" rx="6" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1"/>
<text x="617" y="122" text-anchor="middle" font-size="10.5" font-weight="700" fill="#B9770E">1. Live Traffic Capture (Scapy)</text>
<text x="617" y="139" text-anchor="middle" font-size="9" fill="#555">Npcap NDIS packet hook · 5-tuple session aggregation</text>
<line x1="617" y1="156" x2="617" y2="176" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>

<!-- Right Step 2 -->
<rect x="451" y="176" width="333" height="56" rx="6" fill="#FAF5FF" stroke="#E9D5FF" stroke-width="1"/>
<text x="617" y="194" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6C3483">2. Real-Time Vector Transformation</text>
<text x="617" y="210" text-anchor="middle" font-size="9" fill="#555">Applies pre-fit StandardScaler &amp; label_encoders.pkl</text>
<text x="617" y="224" text-anchor="middle" font-size="8.5" fill="#888">Extracts 39-D vector x ∈ ℝ³⁹</text>
<line x1="617" y1="232" x2="617" y2="252" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>

<!-- Right Step 3: Concurrent Passes -->
<rect x="451" y="252" width="333" height="170" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
<text x="617" y="270" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1a1a2e">3. Concurrent Forward Passes</text>

<!-- Pass 1 -->
<rect x="461" y="280" width="98" height="130" rx="5" fill="white" stroke="#1ABC9C" stroke-width="1"/>
<rect x="461" y="280" width="98" height="6" rx="5" fill="url(#g4)"/>
<text x="510" y="298" text-anchor="middle" font-size="9" font-weight="700" fill="#117864">AE Residual</text>
<text x="510" y="318" text-anchor="middle" font-size="8" fill="#555">x̂ = Dec(Enc(x))</text>
<text x="510" y="338" text-anchor="middle" font-size="8" fill="#555">MSE Error ε</text>
<text x="510" y="358" text-anchor="middle" font-size="8" fill="#555">ε &gt; 0.3269?</text>
<rect x="469" y="380" width="82" height="20" rx="3" fill="#E8F8F5"/>
<text x="510" y="394" text-anchor="middle" font-size="8.5" font-weight="700" fill="#117864">Flag_AE: {0,1}</text>

<!-- Pass 2 -->
<rect x="568" y="280" width="98" height="130" rx="5" fill="white" stroke="#E67E22" stroke-width="1"/>
<rect x="568" y="280" width="98" height="6" rx="5" fill="url(#g2)"/>
<text x="617" y="298" text-anchor="middle" font-size="9" font-weight="700" fill="#B9770E">XGB Predict</text>
<text x="617" y="318" text-anchor="middle" font-size="8" fill="#555">p = P(y=1|x)</text>
<text x="617" y="338" text-anchor="middle" font-size="8" fill="#555">Leaf log-odds</text>
<text x="617" y="358" text-anchor="middle" font-size="8" fill="#555">p &gt; 0.5921?</text>
<rect x="576" y="380" width="82" height="20" rx="3" fill="#FEF5E7"/>
<text x="617" y="394" text-anchor="middle" font-size="8.5" font-weight="700" fill="#B9770E">Flag_XGB: {0,1}</text>

<!-- Pass 3 -->
<rect x="675" y="280" width="98" height="130" rx="5" fill="white" stroke="#27AE60" stroke-width="1"/>
<rect x="675" y="280" width="98" height="6" rx="5" fill="url(#g5)"/>
<text x="724" y="298" text-anchor="middle" font-size="9" font-weight="700" fill="#1E8449">IF Isolation</text>
<text x="724" y="318" text-anchor="middle" font-size="8" fill="#555">h(x) path depth</text>
<text x="724" y="338" text-anchor="middle" font-size="8" fill="#555">Meta score blend</text>
<text x="724" y="358" text-anchor="middle" font-size="8" fill="#555">s &gt; 0.3450?</text>
<rect x="683" y="380" width="82" height="20" rx="3" fill="#EAFAF1"/>
<text x="724" y="394" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1E8449">Flag_IF: {0,1}</text>

<line x1="617" y1="422" x2="617" y2="442" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>

<!-- Right Step 4 -->
<rect x="451" y="442" width="333" height="52" rx="6" fill="#FEFCE8" stroke="#FDE047" stroke-width="1"/>
<text x="617" y="460" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7D6608">4. Weighted Decision Fusion</text>
<text x="617" y="476" text-anchor="middle" font-size="9" fill="#555">Weighted Ensemble: 0.35·AE + 0.40·XGB + 0.25·IF ≥ 0.50</text>
<line x1="617" y1="494" x2="617" y2="514" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>

<!-- Right Step 5 -->
<rect x="451" y="514" width="333" height="52" rx="6" fill="#FDEDEC" stroke="#C0392B" stroke-width="1"/>
<text x="617" y="532" text-anchor="middle" font-size="10.5" font-weight="700" fill="#922B21">5. Threat Severity Grading</text>
<text x="617" y="548" text-anchor="middle" font-size="9" fill="#555">NORMAL · LOW · MEDIUM · HIGH · CRITICAL</text>
<line x1="617" y1="566" x2="617" y2="586" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>

<!-- Right Step 6 -->
<rect x="451" y="586" width="333" height="52" rx="6" fill="#EAFAF1" stroke="#27AE60" stroke-width="1"/>
<text x="617" y="604" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1E8449">6. Streamlit SOC Dashboard Sync</text>
<text x="617" y="620" text-anchor="middle" font-size="9" fill="#555">Live packet velocity meters, telemetry &amp; CSV download</text>

<!-- CAPTION -->
<line x1="80" y1="688" x2="760" y2="688" stroke="#ccc" stroke-width="0.6"/>
<text x="420" y="704" text-anchor="middle" font-size="10" font-weight="700" fill="#333">Fig. 2.  Dual-phase end-to-end pipeline: Offline batch model training vs. real-time streaming inference with ensemble fusion.</text>
<text x="420" y="719" text-anchor="middle" font-size="8.5" fill="#666">Stratified Offline Training (150 epochs) · Real-Time Inference Latency &lt; 2.5 ms · Decision Fusion Thresholding</text>
</svg>
