<svg width="840" height="740" viewBox="0 0 840 740" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M1.5 1.5L8.5 5L1.5 8.5" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#00000015"/></filter>
  <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1A5276"/><stop offset="1" stop-color="#2980B9"/></linearGradient>
  <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6C3483"/><stop offset="1" stop-color="#8E44AD"/></linearGradient>
  <linearGradient id="g3" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0E6251"/><stop offset="1" stop-color="#16A085"/></linearGradient>
  <linearGradient id="g4" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#117864"/><stop offset="1" stop-color="#1ABC9C"/></linearGradient>
  <linearGradient id="g5" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#B9770E"/><stop offset="1" stop-color="#E67E22"/></linearGradient>
  <linearGradient id="g6" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1E8449"/><stop offset="1" stop-color="#27AE60"/></linearGradient>
  <linearGradient id="g7" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7D6608"/><stop offset="1" stop-color="#F1C40F"/></linearGradient>
  <linearGradient id="g8" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#922B21"/><stop offset="1" stop-color="#C0392B"/></linearGradient>
</defs>

<!-- Background -->
<rect width="840" height="740" fill="#F0F2F5"/>

<!-- TITLE BAR -->
<rect x="0" y="0" width="840" height="46" fill="#1a1a2e"/>
<text x="420" y="18" text-anchor="middle" font-size="11.5" font-weight="700" fill="white">AI-Driven Network Traffic Anomaly Detection &amp; Threat Intelligence System</text>
<text x="420" y="34" text-anchor="middle" font-size="9.5" fill="#aab">Tri-Core Hybrid AI (Deep Autoencoder + XGBoost + Isolation Forest) · UNSW-NB15 Benchmark · Real-Time Scapy Capture · Streamlit SOC</text>

<!-- PHASE RAIL -->
<rect x="46" y="54" width="1" height="660" fill="#ccc"/>
<text x="26" y="108" font-size="8" fill="#888" text-anchor="middle" transform="rotate(-90,26,108)">INGESTION</text>
<text x="26" y="204" font-size="8" fill="#888" text-anchor="middle" transform="rotate(-90,26,204)">PREPROCESS</text>
<text x="26" y="300" font-size="8" fill="#888" text-anchor="middle" transform="rotate(-90,26,300)">AI-CORE</text>
<text x="26" y="440" font-size="8" fill="#888" text-anchor="middle" transform="rotate(-90,26,440)">TRI-MODELS</text>
<text x="26" y="570" font-size="8" fill="#888" text-anchor="middle" transform="rotate(-90,26,570)">FUSION</text>
<text x="26" y="670" font-size="8" fill="#888" text-anchor="middle" transform="rotate(-90,26,670)">OUTPUTS</text>

<!-- ROW 1: DATA INGESTION -->
<rect x="120" y="62" width="600" height="64" rx="8" fill="white" filter="url(#sh)"/>
<rect x="120" y="62" width="600" height="10" rx="8" fill="url(#g1)"/>
<rect x="120" y="68" width="600" height="4" fill="url(#g1)"/>
<text x="420" y="86" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a2e">Data Acquisition &amp; Interception Layer</text>
<text x="420" y="103" text-anchor="middle" font-size="9.5" fill="#555">UNSW-NB15 Dataset (175,341 flows · 9 attacks)  ·  Live Packet Capture (Scapy / Npcap NDIS)  ·  Custom CSV Batch Ingestion</text>
<line x1="420" y1="126" x2="420" y2="148" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>

<!-- ROW 2: PREPROCESS -->
<rect x="120" y="148" width="600" height="64" rx="8" fill="white" filter="url(#sh)"/>
<rect x="120" y="148" width="600" height="10" rx="8" fill="url(#g2)"/>
<rect x="120" y="154" width="600" height="4" fill="url(#g2)"/>
<text x="420" y="172" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a2e">Feature Engineering &amp; Preprocessing Pipeline</text>
<text x="420" y="189" text-anchor="middle" font-size="9.5" fill="#555">Missing Imputation (Median/Mode)  ·  LabelEncoder (proto, state)  ·  StandardScaler (μ=0, σ=1)  ·  Variance Selection (d = 39 features)</text>
<line x1="420" y1="212" x2="420" y2="234" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>

<!-- ROW 3: AI-CORE BACKBONE -->
<rect x="120" y="234" width="600" height="64" rx="8" fill="white" filter="url(#sh)"/>
<rect x="120" y="234" width="600" height="10" rx="8" fill="url(#g3)"/>
<rect x="120" y="240" width="600" height="4" fill="url(#g3)"/>
<text x="420" y="258" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a2e">Tri-Core Machine Learning Detection Backbone</text>
<text x="420" y="275" text-anchor="middle" font-size="9.5" fill="#555">Concurrent Hybrid Detection: Semi-Supervised Bottleneck Reconstruction + Supervised Gradient Boosting + Unsupervised Spatial Trees</text>

<!-- Branch arrows to 3 models -->
<path d="M228 298 L228 322 L192 322 L192 344" fill="none" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>
<line x1="420" y1="298" x2="420" y2="344" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>
<path d="M612 298 L612 322 L648 322 L648 344" fill="none" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>

<!-- ROW 4: THREE METHOD CARDS -->
<!-- Model 1: Deep Autoencoder -->
<rect x="68" y="344" width="232" height="150" rx="8" fill="white" filter="url(#sh)"/>
<rect x="68" y="344" width="232" height="10" rx="8" fill="url(#g4)"/>
<rect x="68" y="350" width="232" height="4" fill="url(#g4)"/>
<text x="184" y="370" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a1a2e">Deep Denoising Autoencoder</text>
<line x1="82" y1="378" x2="286" y2="378" stroke="#eee" stroke-width="1"/>
<text x="184" y="394" text-anchor="middle" font-size="9.5" fill="#333">Semi-supervised · Normal y=0</text>
<text x="184" y="410" text-anchor="middle" font-size="9.5" fill="#333">39 → 128 → 64 → 32 → 8 (bottleneck)</text>
<text x="184" y="426" text-anchor="middle" font-size="9.5" fill="#333">Decoder: 8 → 32 → 64 → 128 → 39</text>
<text x="184" y="442" text-anchor="middle" font-size="9" fill="#777">Gaussian noise σ=0.05 · MSE Loss</text>
<text x="184" y="458" text-anchor="middle" font-size="9" fill="#777">150 Epochs · EarlyStopping</text>
<rect x="82" y="466" width="204" height="20" rx="4" fill="#E8F8F5"/>
<text x="184" y="480" text-anchor="middle" font-size="9.5" font-weight="700" fill="#117864">Accuracy: 89.44% · AUC: 0.9767</text>

<!-- Model 2: XGBoost Classifier -->
<rect x="312" y="344" width="216" height="150" rx="8" fill="white" filter="url(#sh)"/>
<rect x="312" y="344" width="216" height="10" rx="8" fill="url(#g5)"/>
<rect x="312" y="350" width="216" height="4" fill="url(#g5)"/>
<text x="420" y="370" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a1a2e">XGBoost Classifier</text>
<line x1="326" y1="378" x2="514" y2="378" stroke="#eee" stroke-width="1"/>
<text x="420" y="394" text-anchor="middle" font-size="9.5" fill="#333">Supervised Gradient Boosting</text>
<text x="420" y="410" text-anchor="middle" font-size="9.5" fill="#333">binary:logistic · 2nd-order Taylor</text>
<text x="420" y="426" text-anchor="middle" font-size="9.5" fill="#333">GridSearchCV (27 combinations)</text>
<text x="420" y="442" text-anchor="middle" font-size="9" fill="#777">n_est=500, depth=8, lr=0.20</text>
<text x="420" y="458" text-anchor="middle" font-size="9" fill="#777">3-Fold Stratified K-Fold CV</text>
<rect x="326" y="466" width="188" height="20" rx="4" fill="#FEF5E7"/>
<text x="420" y="480" text-anchor="middle" font-size="9.5" font-weight="700" fill="#B9770E">Accuracy: 89.77% · AUC: 0.9835</text>

<!-- Model 3: Isolation Forest Hybrid -->
<rect x="540" y="344" width="232" height="150" rx="8" fill="white" filter="url(#sh)"/>
<rect x="540" y="344" width="232" height="10" rx="8" fill="url(#g6)"/>
<rect x="540" y="350" width="232" height="4" fill="url(#g6)"/>
<text x="656" y="370" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a1a2e">Isolation Forest Ensemble</text>
<line x1="554" y1="378" x2="758" y2="378" stroke="#eee" stroke-width="1"/>
<text x="656" y="394" text-anchor="middle" font-size="9.5" fill="#333">Unsupervised Spatial Isolation</text>
<text x="656" y="410" text-anchor="middle" font-size="9.5" fill="#333">200 iTrees · Path depth h(x)</text>
<text x="656" y="426" text-anchor="middle" font-size="9.5" fill="#333">AE Residual Error Meta-Feature</text>
<text x="656" y="442" text-anchor="middle" font-size="9" fill="#777">Boosted Meta-Classifier Stacking</text>
<text x="656" y="458" text-anchor="middle" font-size="9" fill="#777">Contamination auto · Zero-day</text>
<rect x="554" y="466" width="204" height="20" rx="4" fill="#EAFAF1"/>
<text x="656" y="480" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1E8449">Accuracy: 90.43% · AUC: 0.9833</text>

<!-- Converge arrows -->
<path d="M184 494 L184 522 L418 522" fill="none" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>
<line x1="420" y1="494" x2="420" y2="522" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>
<path d="M656 494 L656 522 L422 522" fill="none" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>

<!-- ROW 5: THRESHOLD CALIBRATION & FUSION -->
<rect x="120" y="522" width="600" height="54" rx="8" fill="white" filter="url(#sh)"/>
<rect x="120" y="522" width="600" height="10" rx="8" fill="url(#g7)"/>
<rect x="120" y="528" width="600" height="4" fill="url(#g7)"/>
<text x="420" y="542" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a1a2e">Prior-Adjusted Threshold Calibration &amp; Decision Fusion</text>
<text x="420" y="558" text-anchor="middle" font-size="9" font-weight="600" fill="#7D6608">τ_AE = 0.3269  ·  τ_XGB = 0.5921  ·  τ_IF = 0.3450  ·  Weighted Fusion: 0.35·AE + 0.40·XGB + 0.25·IF ≥ 0.50</text>
<line x1="420" y1="576" x2="420" y2="596" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>

