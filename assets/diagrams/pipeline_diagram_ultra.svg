<svg width="960" height="880" viewBox="0 0 960 880" xmlns="http://www.w3.org/2000/svg" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<defs>
  <!-- Gradients -->
  <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#0F172A"/>
    <stop offset="100%" stop-color="#1E293B"/>
  </linearGradient>

  <linearGradient id="blueHeader" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#0369A1"/>
    <stop offset="100%" stop-color="#0284C7"/>
  </linearGradient>

  <linearGradient id="orangeHeader" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#C2410C"/>
    <stop offset="100%" stop-color="#EA580C"/>
  </linearGradient>

  <linearGradient id="blueCard" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#F0F9FF"/>
    <stop offset="100%" stop-color="#E0F2FE"/>
  </linearGradient>

  <linearGradient id="orangeCard" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#FFF7ED"/>
    <stop offset="100%" stop-color="#FFEDD5"/>
  </linearGradient>

  <linearGradient id="purpleCard" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#FAF5FF"/>
    <stop offset="100%" stop-color="#F3E8FF"/>
  </linearGradient>

  <!-- Markers -->
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M1 1.5L8 5L1 8.5" fill="none" stroke="#0284C7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrow-orange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M1 1.5L8 5L1 8.5" fill="none" stroke="#EA580C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>

  <!-- Shadow -->
  <filter id="layerShadow" x="-2%" y="-2%" width="104%" height="106%" filterUnits="userSpaceOnUse">
    <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.08"/>
  </filter>
</defs>

<!-- White Background -->
<rect width="960" height="880" fill="#FFFFFF"/>

<!-- Title Banner -->
<rect x="30" y="24" width="900" height="50" rx="8" fill="url(#headerGrad)" filter="url(#layerShadow)"/>
<text x="480" y="47" text-anchor="middle" font-size="14.5" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">
  END-TO-END MACHINE LEARNING TRAINING &amp; REAL-TIME INFERENCE PIPELINE
</text>
<text x="480" y="63" text-anchor="middle" font-size="10" font-weight="500" fill="#94A3B8">
  Dual-Stream Architecture: Offline Multi-Model Grid Training vs. Live Streaming Flow Ingestion &amp; Decision Fusion
</text>

<!-- ========================================================================= -->
<!-- LEFT COLUMN: PHASE I OFFLINE TRAINING PIPELINE                            -->
<!-- ========================================================================= -->
<rect x="30" y="86" width="440" height="690" rx="10" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1.2" filter="url(#layerShadow)"/>
<rect x="30" y="86" width="440" height="38" rx="10" fill="url(#blueHeader)"/>
<text x="250" y="110" text-anchor="middle" font-size="12" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">
  PHASE I: OFFLINE MODEL TRAINING PIPELINE
</text>

<!-- Left Step 1 -->
<g transform="translate(50, 136)">
  <rect x="0" y="0" width="400" height="54" rx="6" fill="url(#blueCard)" stroke="#BAE6FD" stroke-width="1"/>
  <text x="16" y="22" font-size="11" font-weight="700" fill="#0369A1">1. UNSW-NB15 Benchmark Dataset Loading</text>
  <text x="16" y="38" font-size="9.5" fill="#0284C7">Training: 82,332 records  ·  Testing: 45,332 records</text>
  <text x="16" y="50" font-size="9" fill="#0369A1">49 initial features across 9 distinct threat categories</text>
</g>

<line x1="250" y1="190" x2="250" y2="210" stroke="#0284C7" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

<!-- Left Step 2 -->
<g transform="translate(50, 210)">
  <rect x="0" y="0" width="400" height="56" rx="6" fill="url(#purpleCard)" stroke="#E9D5FF" stroke-width="1"/>
  <text x="16" y="20" font-size="11" font-weight="700" fill="#6B21A8">2. Feature Engineering &amp; Normalization</text>
  <text x="16" y="36" font-size="9.5" fill="#7E22CE">Missing Imputation (Median/Mode)  ·  LabelEncoder (proto, state)</text>
  <text x="16" y="50" font-size="9" font-weight="600" fill="#9333EA">StandardScaler (μ=0, σ=1)  ·  Variance Selection → d = 39 features</text>
</g>

<line x1="250" y1="266" x2="250" y2="286" stroke="#0284C7" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

<!-- Left Step 3: 3 Model Cards -->
<g transform="translate(50, 286)">
  <rect x="0" y="0" width="400" height="190" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="200" y="20" text-anchor="middle" font-size="11.5" font-weight="800" fill="#0F172A">3. Concurrent Tri-Model Architecture Training</text>

  <!-- Autoencoder Sub-card -->
  <rect x="10" y="30" width="120" height="150" rx="6" fill="#F0FDFA" stroke="#5EEAD4" stroke-width="1"/>
  <text x="70" y="48" text-anchor="middle" font-size="10" font-weight="800" fill="#0F766E">Autoencoder</text>
  <text x="70" y="64" text-anchor="middle" font-size="8.5" fill="#115E59">Normal (y=0) only</text>
  <text x="70" y="78" text-anchor="middle" font-size="8.5" fill="#115E59">34,206 samples</text>
  <text x="70" y="94" text-anchor="middle" font-size="8" font-weight="600" fill="#0F766E">39→128→64→8</text>
  <text x="70" y="108" text-anchor="middle" font-size="8.5" fill="#115E59">MSE + σ=0.05</text>
  <text x="70" y="122" text-anchor="middle" font-size="8.5" fill="#115E59">150 Epochs</text>
  <rect x="18" y="152" width="104" height="20" rx="4" fill="#0D9488"/>
  <text x="70" y="166" text-anchor="middle" font-size="8.5" font-weight="700" fill="#FFFFFF">89.44% Acc</text>

  <!-- XGBoost Sub-card -->
  <rect x="140" y="30" width="120" height="150" rx="6" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1"/>
  <text x="200" y="48" text-anchor="middle" font-size="10" font-weight="800" fill="#C2410C">XGBoost</text>
  <text x="200" y="64" text-anchor="middle" font-size="8.5" fill="#9A3412">GridSearch 27-grid</text>
  <text x="200" y="78" text-anchor="middle" font-size="8.5" fill="#9A3412">3-Fold Stratified</text>
  <text x="200" y="94" text-anchor="middle" font-size="8" font-weight="600" fill="#C2410C">n_est=500, d=8</text>
  <text x="200" y="108" text-anchor="middle" font-size="8.5" fill="#9A3412">lr = 0.20</text>
  <text x="200" y="122" text-anchor="middle" font-size="8.5" fill="#9A3412">scale_pos=1.57</text>
  <rect x="148" y="152" width="104" height="20" rx="4" fill="#EA580C"/>
  <text x="200" y="166" text-anchor="middle" font-size="8.5" font-weight="700" fill="#FFFFFF">89.77% Acc</text>

  <!-- Isolation Forest Sub-card -->
  <rect x="270" y="30" width="120" height="150" rx="6" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
  <text x="330" y="48" text-anchor="middle" font-size="10" font-weight="800" fill="#15803D">IF Ensemble</text>
  <text x="330" y="64" text-anchor="middle" font-size="8.5" fill="#166534">200 Isolation Trees</text>
  <text x="330" y="78" text-anchor="middle" font-size="8.5" fill="#166534">Unsupervised</text>
  <text x="330" y="94" text-anchor="middle" font-size="8" font-weight="600" fill="#15803D">AE Residual Stacking</text>
  <text x="330" y="108" text-anchor="middle" font-size="8.5" fill="#166534">Meta-Boost Layer</text>
  <text x="330" y="122" text-anchor="middle" font-size="8.5" fill="#166534">Zero-Day Isolation</text>
  <rect x="278" y="152" width="104" height="20" rx="4" fill="#16A34A"/>
  <text x="330" y="166" text-anchor="middle" font-size="8.5" font-weight="700" fill="#FFFFFF">90.43% Acc</text>
</g>

<line x1="250" y1="476" x2="250" y2="496" stroke="#0284C7" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

<!-- Left Step 4 -->
<g transform="translate(50, 496)">
  <rect x="0" y="0" width="400" height="54" rx="6" fill="#FEFCE8" stroke="#FDE047" stroke-width="1"/>
  <text x="16" y="20" font-size="11" font-weight="700" fill="#A16207">4. Prior-Adjusted Threshold Calibration</text>
  <text x="16" y="36" font-size="9.5" fill="#854D0E">P95 normal residuals · Youden J statistic · Prior distribution tuning</text>
  <text x="16" y="48" font-size="9" font-weight="700" fill="#713F12">τ_AE = 0.3269  ·  τ_XGB = 0.5921  ·  τ_IF = 0.3450</text>
</g>

<line x1="250" y1="550" x2="250" y2="570" stroke="#0284C7" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

<!-- Left Step 5 -->
<g transform="translate(50, 570)">
  <rect x="0" y="0" width="400" height="54" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1"/>
  <text x="16" y="20" font-size="11" font-weight="700" fill="#1E293B">5. Model Artefact Serialization</text>
  <text x="16" y="36" font-size="9" fill="#475569">models/autoencoder.keras  ·  models/xgboost_model.pkl</text>
  <text x="16" y="48" font-size="9" fill="#475569">models/isolation_forest.pkl  ·  models/scaler.pkl  ·  threshold.json</text>
</g>

<line x1="250" y1="624" x2="250" y2="644" stroke="#0284C7" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

<!-- Left Step 6 -->
<g transform="translate(50, 644)">
  <rect x="0" y="0" width="400" height="46" rx="6" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
  <text x="16" y="18" font-size="11" font-weight="700" fill="#15803D">6. Full Evaluation Metrics &amp; Benchmarks</text>
  <text x="16" y="34" font-size="9.5" font-weight="700" fill="#166534">Top ROC-AUC: 0.9835  ·  F1-Score: 92.55%  ·  Precision: 98.51%</text>
</g>

<!-- ========================================================================= -->
<!-- RIGHT COLUMN: PHASE II REAL-TIME STREAMING INFERENCE PIPELINE             -->
<!-- ========================================================================= -->
<rect x="490" y="86" width="440" height="690" rx="10" fill="#FFFFFF" stroke="#FDBA74" stroke-width="1.2" filter="url(#layerShadow)"/>
<rect x="490" y="86" width="440" height="38" rx="10" fill="url(#orangeHeader)"/>
<text x="710" y="110" text-anchor="middle" font-size="12" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">
  PHASE II: REAL-TIME STREAMING INFERENCE PIPELINE
</text>

<!-- Right Step 1 -->
<g transform="translate(510, 136)">
  <rect x="0" y="0" width="400" height="54" rx="6" fill="url(#orangeCard)" stroke="#FDBA74" stroke-width="1"/>
  <text x="16" y="22" font-size="11" font-weight="700" fill="#C2410C">1. Live Traffic Capture &amp; Ingestion</text>
  <text x="16" y="38" font-size="9.5" fill="#EA580C">Scapy NDIS kernel packet hook  ·  Sliding window aggregator</text>
  <text x="16" y="50" font-size="9" fill="#C2410C">5-tuple connection state tracker (spkts, dpkts, sbytes, rate)</text>
</g>

<line x1="710" y1="190" x2="710" y2="210" stroke="#EA580C" stroke-width="1.5" marker-end="url(#arrow-orange)"/>

<!-- Right Step 2 -->
<g transform="translate(510, 210)">
  <rect x="0" y="0" width="400" height="56" rx="6" fill="url(#purpleCard)" stroke="#E9D5FF" stroke-width="1"/>
  <text x="16" y="20" font-size="11" font-weight="700" fill="#6B21A8">2. Real-Time Feature Vector Extraction</text>
  <text x="16" y="36" font-size="9.5" fill="#7E22CE">Applies pre-fit StandardScaler &amp; label_encoders.pkl</text>
  <text x="16" y="50" font-size="9" font-weight="600" fill="#9333EA">Extracts 39-D normalized inference feature vector x ∈ ℝ³⁹</text>
</g>

<line x1="710" y1="266" x2="710" y2="286" stroke="#EA580C" stroke-width="1.5" marker-end="url(#arrow-orange)"/>

<!-- Right Step 3: Concurrent Forward Passes -->
<g transform="translate(510, 286)">
  <rect x="0" y="0" width="400" height="190" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="200" y="20" text-anchor="middle" font-size="11.5" font-weight="800" fill="#0F172A">3. Multi-Model Concurrent Forward Passes</text>

  <!-- Pass 1 -->
  <rect x="10" y="30" width="120" height="150" rx="6" fill="#F0FDFA" stroke="#5EEAD4" stroke-width="1"/>
  <text x="70" y="48" text-anchor="middle" font-size="10" font-weight="800" fill="#0F766E">AE Residual</text>
  <text x="70" y="68" text-anchor="middle" font-size="8.5" fill="#115E59">x̂ = Dec(Enc(x))</text>
  <text x="70" y="88" text-anchor="middle" font-size="8.5" fill="#115E59">MSE residual ε</text>
  <text x="70" y="108" text-anchor="middle" font-size="8.5" font-weight="600" fill="#0F766E">ε &gt; 0.3269?</text>
  <rect x="18" y="152" width="104" height="20" rx="4" fill="#0D9488"/>
  <text x="70" y="166" text-anchor="middle" font-size="8.5" font-weight="700" fill="#FFFFFF">Flag_AE: {0, 1}</text>

  <!-- Pass 2 -->
  <rect x="140" y="30" width="120" height="150" rx="6" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1"/>
  <text x="200" y="48" text-anchor="middle" font-size="10" font-weight="800" fill="#C2410C">XGB Predict</text>
  <text x="200" y="68" text-anchor="middle" font-size="8.5" fill="#9A3412">p = P(y=1|x)</text>
  <text x="200" y="88" text-anchor="middle" font-size="8.5" fill="#9A3412">Leaf sum probability</text>
  <text x="200" y="108" text-anchor="middle" font-size="8.5" font-weight="600" fill="#C2410C">p &gt; 0.5921?</text>
  <rect x="148" y="152" width="104" height="20" rx="4" fill="#EA580C"/>
  <text x="200" y="166" text-anchor="middle" font-size="8.5" font-weight="700" fill="#FFFFFF">Flag_XGB: {0, 1}</text>

  <!-- Pass 3 -->
  <rect x="270" y="30" width="120" height="150" rx="6" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
  <text x="330" y="48" text-anchor="middle" font-size="10" font-weight="800" fill="#15803D">IF Isolation</text>
  <text x="330" y="68" text-anchor="middle" font-size="8.5" fill="#166534">h(x) path depth</text>
  <text x="330" y="88" text-anchor="middle" font-size="8.5" fill="#166534">Meta score blend</text>
  <text x="330" y="108" text-anchor="middle" font-size="8.5" font-weight="600" fill="#15803D">s &gt; 0.3450?</text>
  <rect x="278" y="152" width="104" height="20" rx="4" fill="#16A34A"/>
  <text x="330" y="166" text-anchor="middle" font-size="8.5" font-weight="700" fill="#FFFFFF">Flag_IF: {0, 1}</text>
</g>

<line x1="710" y1="476" x2="710" y2="496" stroke="#EA580C" stroke-width="1.5" marker-end="url(#arrow-orange)"/>

<!-- Right Step 4 -->
<g transform="translate(510, 496)">
  <rect x="0" y="0" width="400" height="54" rx="6" fill="#FEFCE8" stroke="#FDE047" stroke-width="1"/>
  <text x="16" y="20" font-size="11" font-weight="700" fill="#A16207">4. Prior-Adjusted Weighted Decision Fusion</text>
  <text x="16" y="36" font-size="9.5" fill="#854D0E">Weighted Ensemble Vote: 0.35·AE + 0.40·XGB + 0.25·IF</text>
  <text x="16" y="48" font-size="9" font-weight="700" fill="#713F12">Binary Verdict: is_anomaly = 1 if Combined Score ≥ 0.50</text>
</g>

<line x1="710" y1="550" x2="710" y2="570" stroke="#EA580C" stroke-width="1.5" marker-end="url(#arrow-orange)"/>

<!-- Right Step 5 -->
<g transform="translate(510, 570)">
  <rect x="0" y="0" width="400" height="54" rx="6" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1"/>
  <text x="16" y="20" font-size="11" font-weight="700" fill="#B91C1C">5. Threat Severity Grading &amp; Incident Logging</text>
  <text x="16" y="36" font-size="9.5" font-weight="600" fill="#991B1B">NORMAL  ·  LOW  ·  MEDIUM  ·  HIGH  ·  CRITICAL</text>
  <text x="16" y="48" font-size="9" fill="#B91C1C">Writes incident record to live_detection_results.csv</text>
</g>

<line x1="710" y1="624" x2="710" y2="644" stroke="#EA580C" stroke-width="1.5" marker-end="url(#arrow-orange)"/>

<!-- Right Step 6 -->
<g transform="translate(510, 644)">
  <rect x="0" y="0" width="400" height="46" rx="6" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
  <text x="16" y="18" font-size="11" font-weight="700" fill="#15803D">6. Streamlit SOC Dashboard Real-Time Sync</text>
  <text x="16" y="34" font-size="9.5" fill="#166534">Interactive KPIs, packet rate streams &amp; security alerts</text>
</g>

<!-- ========================================================================= -->
<!-- BOTTOM COMPARISON SUMMARY STRIP                                           -->
<!-- ========================================================================= -->
<g transform="translate(30, 788)">
  <rect x="0" y="0" width="900" height="42" rx="6" fill="#0F172A"/>
  <text x="24" y="26" font-size="10.5" font-weight="800" fill="#38BDF8">DUAL-STREAM PIPELINE SPECIFICATION:</text>
  <text x="310" y="26" font-size="10" fill="#94A3B8">Offline: Batch Stratified Training (150 epochs)</text>
  <text x="620" y="26" font-size="10" fill="#38BDF8">Online: &lt; 2.5 ms Single-Flow Inference Latency</text>
</g>

<!-- Divider Line -->
<line x1="30" y1="842" x2="930" y2="842" stroke="#CBD5E1" stroke-width="0.8"/>

<!-- Figure Caption -->
<text x="480" y="860" text-anchor="middle" font-size="11" font-weight="800" fill="#0F172A">
  Fig. 2. End-to-End Machine Learning Pipeline: Offline Batch Training vs. Real-Time Streaming Inference
</text>

</svg>
