  </marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M1 1.5L8 5L1 8.5" fill="none" stroke="#0284C7" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrow-orange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M1 1.5L8 5L1 8.5" fill="none" stroke="#EA580C" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <filter id="shadow" x="-2%" y="-2%" width="104%" height="106%" filterUnits="userSpaceOnUse">
    <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-opacity="0.06"/>
  </filter>
</defs>

<!-- Pure White Background -->
<rect width="840" height="720" fill="#FFFFFF"/>

<!-- ========================================== -->
<!-- TWO COLUMN CONTAINERS                      -->
<!-- ========================================== -->

<!-- LEFT: Phase I Offline Training -->
<rect x="40" y="24" width="365" height="580" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)"/>
<rect x="40" y="24" width="365" height="36" rx="8" fill="#0284C7"/>
<text x="222" y="47" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">PHASE I: OFFLINE TRAINING PIPELINE</text>

<!-- Left Box 1 -->
<rect x="58" y="74" width="329" height="52" rx="6" fill="#E0F2FE" stroke="#0284C7" stroke-width="0.8"/>
<text x="222" y="94" text-anchor="middle" font-size="11" font-weight="700" fill="#0369A1">UNSW-NB15 Dataset Loading</text>
<text x="222" y="112" text-anchor="middle" font-size="9.5" fill="#0284C7">Train 82,332  ·  Test 45,332 samples  ·  9 Attack Classes</text>

<line x1="222" y1="126" x2="222" y2="148" stroke="#0284C7" stroke-width="1.3" marker-end="url(#arrow-blue)"/>

<!-- Left Box 2 -->
<rect x="58" y="148" width="329" height="56" rx="6" fill="#F3E8FF" stroke="#A855F7" stroke-width="0.8"/>
<text x="222" y="168" text-anchor="middle" font-size="11" font-weight="700" fill="#6B21A8">Feature Engineering &amp; Scaling</text>
<text x="222" y="184" text-anchor="middle" font-size="9.5" fill="#7E22CE">LabelEncoder · StandardScaler (μ=0, σ=1) · d=39 features</text>
<text x="222" y="196" text-anchor="middle" font-size="9" fill="#9333EA">Saves: scaler.pkl, label_encoders.pkl</text>

<line x1="222" y1="204" x2="222" y2="226" stroke="#0284C7" stroke-width="1.3" marker-end="url(#arrow-blue)"/>

<!-- Left Box 3: 3 Models Sub-grid -->
<rect x="58" y="226" width="329" height="152" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="0.8"/>
<text x="222" y="244" text-anchor="middle" font-size="11" font-weight="700" fill="#1E293B">Tri-Model Concurrent Training</text>

<rect x="68" y="254" width="98" height="114" rx="4" fill="#F0FDFA" stroke="#0D9488" stroke-width="0.8"/>
<text x="117" y="270" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0F766E">Autoencoder</text>
<text x="117" y="286" text-anchor="middle" font-size="8.5" fill="#115E59">Normal-only y=0</text>
<text x="117" y="300" text-anchor="middle" font-size="8.5" fill="#115E59">39→128→64→8</text>
<text x="117" y="314" text-anchor="middle" font-size="8.5" fill="#115E59">MSE + Noise 0.05</text>
<text x="117" y="328" text-anchor="middle" font-size="8.5" fill="#115E59">150 Epochs</text>
<text x="117" y="352" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0D9488">89.44% Acc</text>

<rect x="173" y="254" width="98" height="114" rx="4" fill="#FFF7ED" stroke="#EA580C" stroke-width="0.8"/>
<text x="222" y="270" text-anchor="middle" font-size="9.5" font-weight="700" fill="#C2410C">XGBoost</text>
<text x="222" y="286" text-anchor="middle" font-size="8.5" fill="#9A3412">GridSearch 27-grid</text>
<text x="222" y="300" text-anchor="middle" font-size="8.5" fill="#9A3412">n_est=500, d=8</text>
<text x="222" y="314" text-anchor="middle" font-size="8.5" fill="#9A3412">learning_rate=0.2</text>
<text x="222" y="328" text-anchor="middle" font-size="8.5" fill="#9A3412">3-Fold Stratified</text>
<text x="222" y="352" text-anchor="middle" font-size="8.5" font-weight="700" fill="#EA580C">89.77% Acc</text>

<rect x="278" y="254" width="98" height="114" rx="4" fill="#F0FDF4" stroke="#16A34A" stroke-width="0.8"/>
<text x="327" y="270" text-anchor="middle" font-size="9.5" font-weight="700" fill="#15803D">IF Ensemble</text>
<text x="327" y="286" text-anchor="middle" font-size="8.5" fill="#166534">200 Estimators</text>
<text x="327" y="300" text-anchor="middle" font-size="8.5" fill="#166534">Unsupervised</text>
<text x="327" y="314" text-anchor="middle" font-size="8.5" fill="#166534">+ AE Residual Feat</text>
<text x="327" y="328" text-anchor="middle" font-size="8.5" fill="#166534">Meta-Class Stacking</text>
<text x="327" y="352" text-anchor="middle" font-size="8.5" font-weight="700" fill="#16A34A">90.43% Acc</text>

<line x1="222" y1="378" x2="222" y2="400" stroke="#0284C7" stroke-width="1.3" marker-end="url(#arrow-blue)"/>

<!-- Left Box 4 -->
<rect x="58" y="400" width="329" height="52" rx="6" fill="#FEFCE8" stroke="#EAB308" stroke-width="0.8"/>
<text x="222" y="420" text-anchor="middle" font-size="11" font-weight="700" fill="#A16207">Threshold Tuning &amp; Calibration</text>
<text x="222" y="438" text-anchor="middle" font-size="9.5" fill="#854D0E">P95 normal residuals · Youden J · τ_AE=0.327, τ_XGB=0.592</text>

<line x1="222" y1="452" x2="222" y2="474" stroke="#0284C7" stroke-width="1.3" marker-end="url(#arrow-blue)"/>

<!-- Left Box 5 -->
<rect x="58" y="474" width="329" height="52" rx="6" fill="#F8FAFC" stroke="#64748B" stroke-width="0.8"/>
<text x="222" y="494" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">Model &amp; Artefact Serialization</text>
<text x="222" y="512" text-anchor="middle" font-size="9.5" fill="#475569">autoencoder.keras · xgboost_model.pkl · isolation_forest.pkl</text>

<line x1="222" y1="526" x2="222" y2="548" stroke="#0284C7" stroke-width="1.3" marker-end="url(#arrow-blue)"/>

<!-- Left Box 6 -->
<rect x="58" y="548" width="329" height="42" rx="6" fill="#F0FDF4" stroke="#16A34A" stroke-width="0.8"/>
<text x="222" y="567" text-anchor="middle" font-size="10.5" font-weight="700" fill="#15803D">Evaluation Report &amp; Metrics</text>
<text x="222" y="581" text-anchor="middle" font-size="9" fill="#166534">ROC-AUC: 0.9835  ·  F1: 92.55%  ·  Precision: 98.51%</text>


<!-- RIGHT: Phase II Real-Time Inference -->
<rect x="435" y="24" width="365" height="580" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)"/>
<rect x="435" y="24" width="365" height="36" rx="8" fill="#EA580C"/>
<text x="617" y="47" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">PHASE II: REAL-TIME INFERENCE PIPELINE</text>

<!-- Right Box 1 -->
<rect x="453" y="74" width="329" height="52" rx="6" fill="#FFF7ED" stroke="#EA580C" stroke-width="0.8"/>
<text x="617" y="94" text-anchor="middle" font-size="11" font-weight="700" fill="#C2410C">Live Traffic Capture / Stream Ingestion</text>
<text x="617" y="112" text-anchor="middle" font-size="9.5" fill="#EA580C">Scapy NDIS packet sniffer · 5-tuple flow aggregation</text>

<line x1="617" y1="126" x2="617" y2="148" stroke="#EA580C" stroke-width="1.3" marker-end="url(#arrow-orange)"/>

<!-- Right Box 2 -->
<rect x="453" y="148" width="329" height="56" rx="6" fill="#F3E8FF" stroke="#A855F7" stroke-width="0.8"/>
<text x="617" y="168" text-anchor="middle" font-size="11" font-weight="700" fill="#6B21A8">Real-Time Feature Vector Mapping</text>
<text x="617" y="184" text-anchor="middle" font-size="9.5" fill="#7E22CE">Applies saved StandardScaler &amp; Encoders → 39-D vector</text>
<text x="617" y="196" text-anchor="middle" font-size="9" fill="#9333EA">MinMax scaling for autoencoder input compatibility</text>

<line x1="617" y1="204" x2="617" y2="226" stroke="#EA580C" stroke-width="1.3" marker-end="url(#arrow-orange)"/>

<!-- Right Box 3: 3 Forward Passes -->
<rect x="453" y="226" width="329" height="152" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="0.8"/>
<text x="617" y="244" text-anchor="middle" font-size="11" font-weight="700" fill="#1E293B">Tri-Model Concurrent Forward Passes</text>

<rect x="463" y="254" width="98" height="114" rx="4" fill="#F0FDFA" stroke="#0D9488" stroke-width="0.8"/>
<text x="512" y="270" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0F766E">AE Residual</text>
<text x="512" y="288" text-anchor="middle" font-size="8.5" fill="#115E59">x̂ = Decode(Enc(x))</text>
<text x="512" y="306" text-anchor="middle" font-size="8.5" fill="#115E59">MSE Error ε</text>
<text x="512" y="324" text-anchor="middle" font-size="8.5" fill="#115E59">Score: ε &gt; 0.327?</text>
<text x="512" y="352" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0D9488">Flag: {0, 1}</text>

<rect x="568" y="254" width="98" height="114" rx="4" fill="#FFF7ED" stroke="#EA580C" stroke-width="0.8"/>
<text x="617" y="270" text-anchor="middle" font-size="9.5" font-weight="700" fill="#C2410C">XGB Predict</text>
<text x="617" y="288" text-anchor="middle" font-size="8.5" fill="#9A3412">p = P(y=1|x)</text>
<text x="617" y="306" text-anchor="middle" font-size="8.5" fill="#9A3412">Leaf aggregation</text>
<text x="617" y="324" text-anchor="middle" font-size="8.5" fill="#9A3412">Score: p &gt; 0.592?</text>
<text x="617" y="352" text-anchor="middle" font-size="8.5" font-weight="700" fill="#EA580C">Flag: {0, 1}</text>

<rect x="673" y="254" width="98" height="114" rx="4" fill="#F0FDF4" stroke="#16A34A" stroke-width="0.8"/>
<text x="722" y="270" text-anchor="middle" font-size="9.5" font-weight="700" fill="#15803D">IF Anomaly</text>
<text x="722" y="288" text-anchor="middle" font-size="8.5" fill="#166534">Path length h(x)</text>
<text x="722" y="306" text-anchor="middle" font-size="8.5" fill="#166534">Meta score blend</text>
<text x="722" y="324" text-anchor="middle" font-size="8.5" fill="#166534">Score: s &gt; 0.345?</text>
<text x="722" y="352" text-anchor="middle" font-size="8.5" font-weight="700" fill="#16A34A">Flag: {0, 1}</text>

<line x1="617" y1="378" x2="617" y2="400" stroke="#EA580C" stroke-width="1.3" marker-end="url(#arrow-orange)"/>

<!-- Right Box 4 -->
<rect x="453" y="400" width="329" height="52" rx="6" fill="#FEFCE8" stroke="#EAB308" stroke-width="0.8"/>
<text x="617" y="420" text-anchor="middle" font-size="11" font-weight="700" fill="#A16207">Prior-Adjusted Decision Fusion</text>
<text x="617" y="438" text-anchor="middle" font-size="9.5" fill="#854D0E">Weighted Vote: 0.35·AE + 0.40·XGB + 0.25·IF ≥ 0.50</text>

<line x1="617" y1="452" x2="617" y2="474" stroke="#EA580C" stroke-width="1.3" marker-end="url(#arrow-orange)"/>

<!-- Right Box 5 -->
<rect x="453" y="474" width="329" height="52" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="0.8"/>
<text x="617" y="494" text-anchor="middle" font-size="11" font-weight="700" fill="#B91C1C">Severity Grading &amp; Incident Logging</text>
<text x="617" y="512" text-anchor="middle" font-size="9.5" fill="#991B1B">NORMAL  ·  LOW  ·  MEDIUM  ·  HIGH  ·  CRITICAL</text>

<line x1="617" y1="526" x2="617" y2="548" stroke="#EA580C" stroke-width="1.3" marker-end="url(#arrow-orange)"/>

<!-- Right Box 6 -->
<rect x="453" y="548" width="329" height="42" rx="6" fill="#F0FDF4" stroke="#16A34A" stroke-width="0.8"/>
<text x="617" y="567" text-anchor="middle" font-size="10.5" font-weight="700" fill="#15803D">Streamlit SOC Dashboard Sync</text>
<text x="617" y="581" text-anchor="middle" font-size="9" fill="#166534">Real-time alerts, packet telemetry &amp; live health update</text>

<!-- Divider Line -->
<line x1="40" y1="630" x2="800" y2="630" stroke="#E2E8F0" stroke-width="0.8"/>

<!-- Figure Caption -->
<text x="420" y="654" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1E293B">Fig. 2.  End-to-End Machine Learning Pipeline: Offline Model Training vs. Real-Time Streaming Inference</text>
<text x="420" y="670" text-anchor="middle" font-size="9.5" fill="#64748B">Illustrating the dual-stage architecture from offline batch training with GridSearchCV to real-time packet ingestion and ensemble inference.</text>

